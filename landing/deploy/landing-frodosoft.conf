# frodosoft.com.ar y www.frodosoft.com.ar -> landing (contenedor frodosoft_landing).
# Canonico: https://www.frodosoft.com.ar. El apex redirige a www.
#
# DNS en Cloudflare: los dos registros PROXIED (nube naranja), SSL Full (strict).
# El certificado Origin de snippets/ssl-origen.conf ya cubre frodosoft.com.ar y
# *.frodosoft.com.ar (www incluido): no hay que emitir nada.
#
# Deploy en el VPS:
#   cp deploy/landing-frodosoft.conf /etc/nginx/sites-available/landing-frodosoft
#   ln -s /etc/nginx/sites-available/landing-frodosoft /etc/nginx/sites-enabled/landing-frodosoft
#   nginx -t && systemctl reload nginx
#
# Revertir: rm /etc/nginx/sites-enabled/landing-frodosoft && nginx -t && systemctl reload nginx
# (los dos nombres vuelven a caer en el catch-all, que devuelve 444).

server {
    listen 80;
    listen [::]:80;
    server_name frodosoft.com.ar www.frodosoft.com.ar;
    return 301 https://www.frodosoft.com.ar$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name frodosoft.com.ar;
    include snippets/ssl-origen.conf;
    return 301 https://www.frodosoft.com.ar$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.frodosoft.com.ar;
    include snippets/ssl-origen.conf;

    location / {
        proxy_pass http://127.0.0.1:3030;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
