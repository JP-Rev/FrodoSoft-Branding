# nginx DENTRO del contenedor. HTTPS, dominio y redireccion www los resuelve el
# nginx del host (deploy/landing-frodosoft.conf); aca solo se sirven archivos.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    # Lo que genera Astro en _astro/ lleva hash en el nombre: se puede cachear
    # para siempre, un deploy nuevo cambia el nombre.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # El HTML no: si no, Cloudflare o el navegador siguen mostrando la version
    # vieja despues de un deploy.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ $uri.html =404;
    }
}
